<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كودنيمز - كميونتي الدعثه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .card-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
        @media (max-width: 768px) { .card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6">

    <!-- الهيدر -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-gray-900/80 border border-gray-800 p-4 rounded-2xl mb-6 shadow-xl backdrop-blur-md">
        <div class="flex items-center gap-3 mb-3 md:mb-0">
            <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-2xl shadow-lg shadow-indigo-500/30">د</div>
            <div>
                <h1 class="text-xl font-black text-white">وزارة الدعثه الداخلية - كودنيمز</h1>
                <p class="text-xs text-gray-400">النسخة الرسمية للكميونتي والكتيكات العليا</p>
            </div>
        </div>
        <div class="flex items-center gap-4 bg-gray-950 px-4 py-2 rounded-xl border border-gray-800 text-sm">
            <span class="text-blue-400 font-bold">الفريق الأزرق: <span id="blue-score" class="text-lg">9</span> متبقي</span>
            <span class="text-gray-600">|</span>
            <span class="text-red-400 font-bold">الفريق الأحمر: <span id="red-score" class="text-lg">8</span> متبقي</span>
        </div>
    </header>

    <!-- محتوى اللعبة -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-6 max-w-7xl mx-auto w-full">
        <!-- لوحة البطاقات -->
        <div class="lg:col-span-3 bg-gray-900/50 p-4 md:p-6 rounded-2xl border border-gray-800/80 shadow-2xl">
            <div id="board" class="card-grid"></div>
        </div>

        <!-- اللوحة الجانبية للاعب -->
        <div class="space-y-4">
            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl shadow-xl">
                <h2 class="font-bold text-base mb-3 text-indigo-400">👤 ملف اللاعب الحالي</h2>
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">اسمك في السيرفر:</label>
                        <input type="text" id="player-name" value="مخرب الدعثه" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">انضم للفريق:</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setTeam('blue')" id="btn-blue" class="py-2 rounded-xl border border-blue-600/40 bg-blue-950/40 text-blue-300 font-bold text-xs transition">الفريق الأزرق</button>
                            <button onclick="setTeam('red')" id="btn-red" class="py-2 rounded-xl border border-red-600/40 bg-red-950/40 text-red-300 font-bold text-xs transition">الفريق الأحمر</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl shadow-xl">
                <h2 class="font-bold text-base mb-2 text-yellow-400">💡 تلميح القائد الحالي</h2>
                <div id="clue-display" class="bg-gray-950 border border-gray-800 p-3 rounded-xl text-center text-sm text-gray-300">
                    القائد لم يعطِ تلميحًا بعد 🔻
                </div>
            </div>

            <button onclick="endTurn()" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 py-3 rounded-xl font-bold text-sm transition shadow-lg">
                إنهاء الدور ⏭️
            </button>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="text-center text-xs text-gray-500 mt-6">
        وزارة الدعثه الداخلية © 2026 - جميع الحقوق محفوظة للكميونتي الأسطوري
    </footer>

    <script>
        const defaultWords = [
            "الدعثه", "وزير الداخلية", "روم الفويس", "المخرب", "عضو مميز",
            "أدمن", "عميل سري", "ميوت", "ريأكشن", "طفطفة",
            "البوت الأسطوري", "عفو ملكي", "سبام", "رآنك", "أوبن ميك",
            "سيرفر الديسكورد", "بطولة السيرفر", "ديفين", "سيرفر خاص", "شات عام",
            "سحب جوائز", "هاتفك", "عقوبات", "كلمة السر", "تكتيك"
        ];

        let gameState = {
            words: [...defaultWords].sort(() => Math.random() - 0.5),
            revealed: Array(25).fill(false),
            blueScore: 9,
            redScore: 8,
            currentTeam: 'blue'
        };

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            gameState.words.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = `aspect-[4/3] flex items-center justify-center p-2 text-center rounded-xl font-bold text-xs md:text-sm cursor-pointer transition select-none border shadow-md ${
                    gameState.revealed[index] ? 'bg-gray-800 text-gray-400 border-gray-700 opacity-60' : 'bg-gray-950 text-white border-gray-800 hover:border-indigo-500 hover:scale-[1.02]'
                }`;
                card.innerText = word;
                card.onclick = () => {
                    if(!gameState.revealed[index]) {
                        gameState.revealed[index] = true;
                        renderBoard();
                    }
                };
                board.appendChild(card);
            });
            document.getElementById('blue-score').innerText = gameState.blueScore;
            document.getElementById('red-score').innerText = gameState.redScore;
        }

        function setTeam(team) {
            document.getElementById('btn-blue').className = `py-2 rounded-xl border font-bold text-xs transition ${team === 'blue' ? 'bg-blue-600 text-white border-blue-500 shadow-lg shadow-blue-600/30' : 'border-blue-600/40 bg-blue-950/40 text-blue-300'}`;
            document.getElementById('btn-red').className = `py-2 rounded-xl border font-bold text-xs transition ${team === 'red' ? 'bg-red-600 text-white border-red-500 shadow-lg shadow-red-600/30' : 'border-red-600/40 bg-red-950/40 text-red-300'}`;
        }

        function endTurn() {
            gameState.currentTeam = gameState.currentTeam === 'blue' ? 'red' : 'blue';
            alert('انتقل الدور إلى الفريق الآخر!');
        }

        renderBoard();
    </script>
</body>
</html>
