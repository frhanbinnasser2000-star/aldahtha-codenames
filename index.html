<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة كود نيمز - Codenames</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2a2a2a;
            --text-color: #ffffff;
            --red-team: #e74c3c;
            --blue-team: #3498db;
            --bystander: #95a5a6;
            --assassin: #2c3e50;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { margin-bottom: 5px; }
        .game-info {
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background-color: #ecf0f1;
            color: #2c3e50;
            font-weight: bold;
            font-size: 16px;
            padding: 25px 10px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
        }
        .card:hover { transform: scale(1.03); }
        .card.revealed.red { background-color: var(--red-team); color: white; }
        .card.revealed.blue { background-color: var(--blue-team); color: white; }
        .card.revealed.bystander { background-color: var(--bystander); color: white; }
        .card.revealed.assassin { background-color: var(--assassin); color: white; border: 3px solid red; }
        
        .controls {
            margin-top: 25px;
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 5px;
        }
        button:hover { background-color: #d35400; }
        .role-selector { margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>لعبة كود نيمز (Codenames)</h1>
    <div class="game-info">
        <p id="turn-indicator">الدور: الفريق الأحمر (أعطِ تلميحاً)</p>
        <div class="role-selector">
            <label><input type="radio" name="role" value="operative" checked onclick="setRole('operative')"> لاعب ميداني</label>
            <label style="margin-right: 15px;"><input type="radio" name="role" value="spymaster" onclick="setRole('spymaster')"> رئيس الجواسيس (Spymaster)</label>
        </div>
    </div>

    <div class="board" id="game-board"></div>

    <div class="controls">
        <button onclick="resetGame()">لعبة جديدة / تغيير الكلمات</button>
    </div>

    <script>
        const wordsList = [
            "تفاح", "شجرة", "قمر", "نجمة", "سيارة", "طائرة", "بحر", "موجة", "جبل", "قلم",
            "حاسوب", "هاتف", "مسدس", "مفتاح", "باب", "شمس", "ساعة", "طاولة", "كرسي", "مدینة",
            "نمر", "أسد", "قارب", "طريق", "ذهب", "فضة", "حجر", "حديد", "سيف", "درع"
        ];

        let board = [];
        let currentRole = 'operative';
        let currentTurn = 'red'; // red or blue

        function initGame() {
            // اختيار 25 كلمة عشوائية
            let shuffledWords = [...wordsList].sort(() => 0.5 - Math.random()).slice(0, 25);
            
            // توزيع الأدوار (9 أحمر، 8 أزرق، 7 حيادي، 1 قاتل)
            let types = ['red', 'red', 'red', 'red', 'red', 'red', 'red', 'red', 'red',
                         'blue', 'blue', 'blue', 'blue', 'blue', 'blue', 'blue', 'blue',
                         'bystander', 'bystander', 'bystander', 'bystander', 'bystander', 'bystander', 'bystander',
                         'assassin'];
            types.sort(() => 0.5 - Math.random());

            board = shuffledWords.map((word, index) => ({
                word: word,
                type: types[index],
                revealed: false
            }));

            renderBoard();
        }

        function renderBoard() {
            const boardElement = document.getElementById('game-board');
            boardElement.innerHTML = '';

            board.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.classList.add('card');
                cardDiv.innerText = card.word;

                if (card.revealed) {
                    cardDiv.classList.add('revealed', card.type);
                } else if (currentRole === 'spymaster') {
                    // رئيس الجواسيس يرى الألوان بشفافية أو إطار
                    cardDiv.style.border = `4px solid ${getColorCode(card.type)}`;
                }

                cardDiv.onclick = () => revealCard(index);
                boardElement.appendChild(cardDiv);
            });
        }

        function getColorCode(type) {
            switch(type) {
                case 'red': return '#e74c3c';
                case 'blue': return '#3498db';
                case 'bystander': return '#95a5a6';
                case 'assassin': return '#2c3e50';
                default: return '#fff';
            }
        }

        function revealCard(index) {
            if (board[index].revealed) return;
            
            board[index].revealed = true;
            
            if (board[index].type === 'assassin') {
                alert('انتهت اللعبة! لقد اخترتم بطاقة القاتل (Assassin). خسر الفريق!');
                revealAll();
            }

            renderBoard();
        }

        function setRole(role) {
            currentRole = role;
            renderBoard();
        }

        function revealAll() {
            board.forEach(card => card.revealed = true);
            renderBoard();
        }

        function resetGame() {
            initGame();
        }

        // بدء اللعبة لأول مرة
        initGame();
    </script>
</body>
</html>
