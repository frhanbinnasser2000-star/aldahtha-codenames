<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السرية - وزارة الدعثه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- نافذة تسجيل الدخول برقم سري -->
    <div id="login-modal" class="bg-gray-900 border border-gray-800 p-8 rounded-2xl w-full max-w-md shadow-2xl text-center">
        <div class="w-16 h-16 bg-red-600/20 border border-red-500 text-red-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
        <h1 class="text-xl font-black mb-2 text-white">منطقة الإدارة السرية</h1>
        <p class="text-xs text-gray-400 mb-6">أدخل الرقم السري للوصول إلى لوحة تحكم البطولة</p>
        <input type="password" id="admin-pass" placeholder="الرقم السري (aldahtha2026)" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-center text-white text-sm mb-4 focus:outline-none focus:border-red-500">
        <button onclick="checkPassword()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-red-600/30">دخول المشرف</button>
    </div>

    <!-- لوحة التحكم الفعلية (تظهر بعد الدخول الصحيح) -->
    <div id="admin-dashboard" class="hidden w-full max-w-2xl bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl space-y-6">
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-lg font-black text-white">لوحة تحكم القائد الأعلى ⚡</h1>
                <p class="text-xs text-gray-400">إدارة مجريات اللعبة، إعادة التشغيل، وتغيير الكلمات</p>
            </div>
            <button onclick="location.reload()" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-xl text-xs font-bold text-red-400 transition">تسجيل خروج</button>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-2">تخصيص كلمات اللعبة (افصل بينها بفاصلة ,):</label>
                <textarea id="custom-words-input" rows="4" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-indigo-500" placeholder="الدعثه, وزير الداخلية, مخرب, ..."></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="resetGame()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm">إعادة تشغيل / توزيع كلمات جديدة 🔄</button>
                <button onclick="alert('تم تفعيل وضع القائد لجميع الجلسات!')" class="bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold py-3 rounded-xl transition text-sm">تحديث حالة اللعبة 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_PIN = "aldahtha2026"; // تقدر تغير الرقم السري من هنا

        function checkPassword() {
            const val = document.getElementById('admin-pass').value;
            if(val === SECRET_PIN) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            } else {
                alert('الرقم السري خاطئ! حاول مجدداً.');
            }
        }

        function resetGame() {
            alert('تمت إعادة ضبط اللعبة وتحديث اللوحة بنجاح!');
        }
    </script>
</body>
</html>
