<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>كود نيمز - سيرفر الدعثه</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; direction: rtl; }
        
        #setup { max-width: 1050px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        
        /* جعل خانات الإدخال متناسقة وواضحة */
        .top-inputs { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; direction: rtl; }
        input { padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2d2d2d; color: #fff; font-size: 16px; width: 250px; text-align: center; outline: none; }

        /* تثبيت اتجاه الحاويات لضمان الأزرق يسار والأحمر يمين مثل الموقع الأصلي */
        .lobby-container { display: flex; justify-content: space-between; gap: 20px; direction: ltr; }
        
        .team-column { flex: 1; background: #262626; border-radius: 10px; padding: 15px; border: 2px solid #444; text-align: right; }
        .blue-team { border-color: #5865F2; }
        .red-team { border-color: #ed4245; }
        
        .team-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; padding: 8px; border-radius: 6px; color: #fff; text-align: center; }
        .blue-team .team-title { background: #5865F2; }
        .red-team .team-title { background: #ed4245; }

        .role-box { background: #333; padding: 12px; margin: 10px 0; border-radius: 8px; text-align: right; }
        .role-title { font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: bold; }
        
        /* القسم الأوسط */
        .middle-column { flex: 1.3; display: flex; flex-direction: column; justify-content: space-between; background: #181818; padding: 20px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        
        .btn-join { background: #2ecc71; color: white; cursor: pointer; font-weight: bold; width: 100%; padding: 10px; border-radius: 5px; border: none; transition: 0.2s; }
        .btn-join:hover { background: #27ae60; }
        
        .btn-start { background: #2ecc71; color: white; font-size: 20px; font-weight: bold; cursor: pointer; padding: 15px; width: 100%; border-radius: 8px; border: none; margin-top: 15px; transition: 0.2s; }
        .btn-start:hover { background: #27ae60; }

        /* لوحة اللعبة الداخلية */
        #game-board { display: none; margin-top: 20px; direction: rtl; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 800px; margin: 0 auto; }
        .card { background: #2f3136; padding: 25px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; user-select: none; transition: 0.2s; }
        .card:hover { background: #40444b; }
        
        .card.red-revealed { background: #ed4245 !important; }
        .card.blue-revealed { background: #5865F2 !important; }
        .card.black-revealed { background: #000 !important; color: #ff0000; }
        .card.neutral-revealed { background: #4f545c !important; }
        
        .spymaster-red { border: 3px solid #ed4245; }
        .spymaster-blue { border: 3px solid #5865F2; }
        .spymaster-black { border: 3px solid #000; }
        .spymaster-neutral { border: 3px solid #4f545c; }
    </style>
</head>
<body>

    <div id="setup">
        <h2 style="margin-top: 0; color: #fff;">كود نيمز - سيرفر الدعثه</h2>
        
        <!-- خانات الإدخال في الأعلى -->
        <div class="top-inputs">
            <input type="text" id="room" placeholder="اسم الغرفة (مثال: da3thah)" required>
            <input type="text" id="username" placeholder="اسمك في السيرفر..." required>
        </div>

        <div class="lobby-container">
            <!-- الفريق الأزرق (يسار الموقع تماماً كالأصلي) -->
            <div class="team-column blue-team">
                <div class="team-title">BLUE TEAM</div>
                <div class="role-box">
                    <div class="role-title">OPERATIVES (العملاء)</div>
                    <button class="btn-join" onclick="setTeamAndRole('blue', 'operative')">انضم للفريق</button>
                </div>
                <div class="role-box">
                    <div class="role-title">SPYMASTERS (رئيس التجسس)</div>
                    <button class="btn-join" onclick="setTeamAndRole('blue', 'spymaster')">انضم كرئيس</button>
                </div>
            </div>

            <!-- المنتصف (الإعدادات وزر البدء) -->
            <div class="middle-column">
                <div>
                    <h3 style="margin:0 0 10px 0; color:#ddd;">GAME SETTINGS</h3>
                    <p style="font-size: 13px; color: #888; line-height: 1.5;">
                        الدور الحالي المختار: <span id="current-selection" style="color: #2ecc71; font-weight: bold;">الفريق الأزرق - عميل</span>
                    </p>
                </div>
                <div>
                    <button class="btn-start" onclick="startGame()">START GAME</button>
                </div>
            </div>

            <!-- الفريق الأحمر (يمين الموقع تماماً كالأصلي) -->
            <div class="team-column red-team">
                <div class="team-title">RED TEAM</div>
                <div class="role-box">
                    <div class="role-title">OPERATIVES (العملاء)</div>
                    <button class="btn-join" onclick="setTeamAndRole('red', 'operative')">انضم للفريق</button>
                </div>
                <div class="role-box">
                    <div class="role-title">SPYMASTERS (رئيس التجسس)</div>
                    <button class="btn-join" onclick="setTeamAndRole('red', 'spymaster')">انضم كرئيس</button>
                </div>
            </div>
        </div>
    </div>

    <!-- لوحة اللعبة -->
    <div id="game-board">
        <h3 id="status-text"></h3>
        <button onclick="resetGame()" style="margin-bottom: 15px; background: #ed4245; color:#fff; cursor:pointer; padding:10px 20px; border-radius:5px; border:none;">إعادة تشغيل الجيم</button>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        const socket = io();
        let selectedTeam = 'blue';
        let selectedRole = 'operative';

        function setTeamAndRole(team, role) {
            selectedTeam = team;
            selectedRole = role;
            
            const teamName = team === 'blue' ? 'الفريق الأزرق' : 'الفريق الأحمر';
            const roleName = role === 'operative' ? 'عميل' : 'رئيس التجسس';
            document.getElementById('current-selection').innerText = `${teamName} - ${roleName}`;
        }

        function startGame() {
            const username = document.getElementById('username').value;
            const room = document.getElementById('room').value;

            if (!username || !room) {
                alert('الرجاء إدخال اسمك واسم الغرفة أولاً!');
                return;
            }

            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-board').style.display = 'block';

            socket.emit('joinRoom', { room, username, team: selectedTeam, role: selectedRole });
        }

        socket.on('gameState', (game) => {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            document.getElementById('status-text').innerHTML = `دور الفريق: <span style="color:${game.turn === 'red' ? '#ed4245' : '#5865F2'}">${game.turn === 'red' ? 'الأحمر' : 'الأزرق'}</span> | النقاط المتبقية - أحمر: ${game.scores.red} | أزرق: ${game.scores.blue}`;

            if (game.gameOver) {
                alert('انتهت اللعبة! الفائز هو: ' + game.winner);
            }

            game.board.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = item.word;

                if (item.revealed) {
                    card.classList.add(`${item.type}-revealed`);
                } else if (selectedRole === 'spymaster') {
                    card.classList.add(`spymaster-${item.type}`);
                }

                card.onclick = () => {
                    if (selectedRole === 'operative' && !item.revealed && !game.gameOver) {
                        socket.emit('selectCard', index);
                    }
                };

                grid.appendChild(card);
            });
        });

        function resetGame() {
            socket.emit('resetGame');
        }
    </script>
</body>
</html>
